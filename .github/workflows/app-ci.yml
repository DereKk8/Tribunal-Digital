# CI de la aplicación (Agente B). Solo usa el contenido DEMO: nunca hay claves reales en CI.
name: Aplicación — pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Puerta de contrato (DEMO)
        run: npm run validar
      - name: Puerta de contrato (real) — PENDIENTE si falta el paquete de Agente A
        run: |
          set +e
          npm run validar:real
          code=$?
          if [ $code -eq 2 ]; then echo "::notice::Integración real PENDIENTE (falta el paquete o la clave real; la clave nunca está en CI)"; exit 0; fi
          exit $code
      - name: Pruebas unitarias y de integración
        run: npm test
      - name: Simulación determinista de cinco equipos
        run: npm run simular
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (navegador real)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: test-results/
          retention-days: 7
