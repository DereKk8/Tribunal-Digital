<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="E01-title E01-desc" font-family="'Pretendard Variable', Pretendard, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif"><title id="E01-title">E01 · Página web del club</title><desc id="E01-desc">E01 · Página web del club
Página web oficial del Club Atalaya eSports (clubatalaya.gg/semillero). Publicada el lunes 7 de septiembre de 2026.
Título: «Semillero Atalaya 2026». Subtítulo: «Pruebas abiertas de Fractal Arena para jugadores de 13 a 17 años».
1 · Inscripción: «La hace la madre, el padre o el tutor en el Portal Familias, hasta el miércoles 30 de septiembre a las 23:59.»
2 · Clasificatorio online: «Sábado 3 de octubre, de 10:00 a 14:00, con transmisión en Lumen Live (@clubatalaya).»
3 · Final presencial: «Los 40 mejores del clasificatorio pasan a la final del sábado 24 de octubre en la Sede Atalaya, acompañados por un adulto responsable.»
Cuerpo técnico: Rai Ferrer (entrenador principal), Lucía Paz (analista), Tomás Ibarra (preparador). «Nuestro cuerpo técnico sigue partidas del servidor y puede invitar a jugadores destacados a inscribirse.»
«Coordinación y protección de menores: Inés Calvo.»
Rai Ferrer aparece con gorra morada del club y auriculares amarillos.</desc><rect x="0" y="0" width="1200" height="900" rx="16" fill="#ffffff"/><rect x="0" y="0" width="1200" height="96" rx="16" fill="#e5e7eb"/><rect x="0" y="60" width="1200" height="36" rx="0" fill="#e5e7eb"/><circle cx="28" cy="22" r="7" fill="#f87171"/><circle cx="50" cy="22" r="7" fill="#fbbf24"/><circle cx="72" cy="22" r="7" fill="#34d399"/><path d="M100 40 V14 a8 8 0 0 1 8 -8 H458.955078125 a8 8 0 0 1 8 8 V40 Z" fill="#ffffff"/><g transform="translate(114 13) scale(0.2)"><rect width="100" height="100" rx="30" fill="#5b21b6"/><g transform="translate(8 6) scale(0.84)"><path fill="#facc15" d="M26 14h10v9h8v-9h12v9h8v-9h10v22h-6l6 50H26l6-50h-6z"/><path fill="rgba(0,0,0,0.28)" d="M44 86V66a6 6 0 0 1 12 0v20z"/><rect x="45" y="44" width="10" height="10" rx="2" fill="rgba(0,0,0,0.28)"/></g></g><text x="142" y="29" font-size="15" font-weight="600" fill="#374151" text-anchor="start">Club Atalaya eSports · Semillero Atalaya 2026</text><rect x="110" y="52" width="980" height="36" rx="18" fill="#ffffff" stroke="#d1d5db"/><g transform="translate(134 61)" fill="#6b7280"><rect x="0" y="7" width="13" height="10" rx="2"/><path d="M3 7 V4 a3.5 3.5 0 0 1 7 0 V7" stroke="#6b7280" stroke-width="2" fill="none"/></g><text x="158" y="76" font-size="18" font-weight="500" fill="#374151" text-anchor="start">clubatalaya.gg/semillero</text><rect x="0" y="96" width="1200" height="76" rx="0" fill="#4c1d95"/><g transform="translate(40 108) scale(0.52)"><rect width="100" height="100" rx="25" fill="#5b21b6"/><g transform="translate(8 6) scale(0.84)"><path fill="#facc15" d="M26 14h10v9h8v-9h12v9h8v-9h10v22h-6l6 50H26l6-50h-6z"/><path fill="rgba(0,0,0,0.28)" d="M44 86V66a6 6 0 0 1 12 0v20z"/><rect x="45" y="44" width="10" height="10" rx="2" fill="rgba(0,0,0,0.28)"/></g></g><text x="106" y="137" font-size="23" font-weight="900" fill="#ffffff" text-anchor="start" letter-spacing="2">CLUB ATALAYA</text><text x="106" y="158" font-si